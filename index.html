<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Cepat Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #video { width: 100%; height: 100%; object-fit: cover; }
        .box {
            width: 100%; max-width: 320px; aspect-ratio: 1/1;
            margin: auto; border-radius: 24px;
            overflow: hidden; border: 4px solid #3b82f6;
            position: relative;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        /* Garis pemindai animasi */
        .scan-line {
            position: absolute; width: 100%; height: 2px;
            background: rgba(59, 130, 246, 0.8);
            top: 0; left: 0; animation: move 2s linear infinite;
        }
        @keyframes move {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
</head>

<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-2xl font-bold mb-6 tracking-widest text-blue-500">SCAN BARCODE</h1>

    <div class="box">
        <div class="scan-line"></div>
        <video id="video" playsinline></video>
    </div>

    <p id="status" class="mt-6 text-lg font-medium text-gray-400">Menunggu izin kamera...</p>

    <script>
        const status = document.getElementById("status");
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        
        // Inisialisasi ZXing
        const reader = new ZXing.BrowserMultiFormatReader();
        let isProcessing = false;
        let lastCode = "";

        async function startScanner() {
            try {
                // Mendapatkan daftar perangkat kamera
                const videoDevices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
                
                // Pilih kamera belakang jika ada, jika tidak pakai kamera pertama
                const selectedDeviceId = videoDevices.length > 1 ? videoDevices[1].deviceId : videoDevices[0].deviceId;

                status.innerText = "Kamera aktif. Siap scan! 🚀";

                reader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        const kode = result.getText();

                        // Cegah double scan kode yang sama dalam waktu singkat
                        if (kode === lastCode || isProcessing) return;

                        lastCode = kode;
                        isProcessing = true;
                        handleScanSuccess(kode);
                    }
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        console.error(err);
                    }
                });

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Gagal akses kamera. Pastikan pakai HTTPS/Localhost.";
                Swal.fire("Error", "Kamera tidak ditemukan atau izin ditolak", "error");
            }
        }

        function handleScanSuccess(kode) {
            status.innerText = "✔ Terdeteksi: " + kode;
            if (navigator.vibrate) navigator.vibrate(70);

            // Tampilkan loading sebentar agar user tahu proses sedang berjalan
            Swal.fire({
                title: 'Memproses...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            prosesAPI(kode);

            // Reset scanner setelah jeda 3 detik agar bisa scan lagi
            setTimeout(() => {
                isProcessing = false;
                lastCode = "";
                status.innerText = "Siap scan! 🚀";
            }, 3000);
        }

        function prosesAPI(kode) {
            const now = new Date();
            const tgl = now.toLocaleDateString('id-ID');
            const jam = now.toLocaleTimeString('id-ID');

            // 1. Cek Data di Sheet Master
            fetch(`${API_URL}/search?sheet=Master&KODE=${kode}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        const siswa = data[0];
                        
                        // 2. Jika ketemu, catat ke Sheet Log
                        return fetch(`${API_URL}?sheet=Log`, {
                            method: "POST",
                            headers: {"Content-Type":"application/json"},
                            body: JSON.stringify({
                                NO: "INCREMENT",
                                WAKTU: `${tgl} ${jam}`,
                                KODE: kode,
                                NAMA: siswa.NAMA
                            })
                        }).then(() => {
                            Swal.fire({
                                title: siswa.NAMA,
                                text: "Absensi Berhasil Dicatat",
                                icon: "success",
                                timer: 2000,
                                showConfirmButton: false
                            });
                        });
                    } else {
                        Swal.fire("Tidak Terdaftar", "Kode barcode tidak dikenali", "error");
                    }
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("API Error", "Gagal menghubungi database", "error");
                });
        }

        // Mulai saat halaman selesai dimuat
        window.addEventListener('load', startScanner);
    </script>

</body>
</html>
