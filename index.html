<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Speed Scanner SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #reader video { border-radius: 1.5rem; object-fit: cover; }
        /* Memberikan efek visual garis scan yang bergerak cepat */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 15px 5px rgba(59, 130, 246, 0.5);
            animation: moveScan 1.5s infinite linear;
        }
        @keyframes moveScan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-[2.5rem] shadow-2xl border border-slate-700 mt-10 relative overflow-hidden">
        <h1 class="text-2xl font-black text-center mb-1 tracking-tight text-blue-500">FAST SCANNER</h1>
        <p class="text-slate-400 text-center text-xs mb-6 uppercase tracking-widest">SMAN 2 PARE</p>
        
        <div class="relative">
            <div id="reader" class="overflow-hidden rounded-3xl border-4 border-blue-600/30"></div>
            <div class="scan-line"></div>
        </div>

        <div id="result-label" class="mt-6 p-4 bg-slate-900/80 rounded-2xl text-center text-sm font-bold text-blue-300 border border-slate-700">
            Siap Memindai...
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        const html5QrCode = new Html5Qrcode("reader");

        const config = { 
            fps: 60, // Menaikkan FPS ke maksimal untuk deteksi instan
            qrbox: { width: 280, height: 160 }, // Area scan lebih lebar untuk barcode panjang
            aspectRatio: 1.0,
            rememberLastUsedCamera: true,
            // Mengaktifkan fitur pencitraan tingkat lanjut
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        };

        const onScanSuccess = (decodedText) => {
            // Langsung pause agar tidak terjadi scan ganda (double-trigger)
            html5QrCode.pause(true);
            vibrateMobile(); // Memberi feedback getar pada HP
            prosesAbsensi(decodedText);
        };

        // Fungsi getar untuk menandakan scan berhasil (khusus Android)
        function vibrateMobile() {
            if (navigator.vibrate) navigator.vibrate(100);
        }

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

        async function prosesAbsensi(kode) {
            const cleanKode = kode.trim();
            document.getElementById('result-label').innerText = "MENCOCOKKAN...";

            try {
                // Optimasi Fetch dengan Timeout agar tidak menunggu terlalu lama
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${cleanKode}&casesensitive=false`, { signal: controller.signal });
                const data = await res.json();
                clearTimeout(timeoutId);

                if (data && data.length > 0) {
                    const siswa = data[0];
                    const sekarang = new Date();
                    const waktuLog = `${sekarang.toLocaleTimeString('id-ID').replace(/\./g, ':')}, ${sekarang.toLocaleDateString('id-ID')}`;

                    // Kirim data Log secara asinkron (tidak perlu menunggu selesai untuk tampilkan sukses)
                    fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "WAKTU": waktuLog,
                            "KODE": cleanKode,
                            "NAMA": siswa.nama
                        })
                    });

                    Swal.fire({
                        icon: 'success',
                        title: 'Selamat!',
                        html: `<div class="text-left font-mono">
                                <b>Nama:</b> ${siswa.nama}<br>
                                <b>Kelas:</b> ${siswa.kelas}<br>
                                <b>Jam:</b> ${waktuLog}</div>`,
                        timer: 2000,
                        showConfirmButton: false
                    });

                    document.getElementById('result-label').innerText = "Berhasil: " + siswa.nama;
                } else {
                    Swal.fire('Gagal', 'Kode ' + cleanKode + ' Tidak Ada!', 'error');
                }
            } catch (error) {
                document.getElementById('result-label').innerText = "Gagal Koneksi Database.";
            } finally {
                // Resume lebih cepat agar antrean berikutnya bisa langsung scan
                setTimeout(() => {
                    html5QrCode.resume();
                    document.getElementById('result-label').innerText = "Siap Memindai...";
                }, 2000);
            }
        }
    </script>
</body>
</html>
