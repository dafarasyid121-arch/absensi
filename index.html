<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner SMAN 2 Pare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1/1;
            margin: auto;
            border-radius: 2.5rem;
            overflow: hidden;
            border: 4px solid #3b82f6;
        }

        .capturing {
            animation: flash 0.2s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            z-index: 10;
            animation: moveLine 2s infinite linear;
        }

        @keyframes moveLine {
            0% { top: 20%; }
            100% { top: 80%; }
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h1 class="text-2xl font-black mb-1">SMAN 2 PARE</h1>
        <p class="text-blue-500 text-[10px] font-bold tracking-[0.3em] mb-8 uppercase">
            Fast Realtime Scanner
        </p>

        <div id="wrapper" class="scanner-box shadow-2xl bg-black">
            <video id="video" playsinline></video>
            <div class="scan-line"></div>
        </div>

        <div class="mt-8">
            <p id="status" class="text-sm font-medium text-slate-400">
                Mengaktifkan kamera...
            </p>
        </div>
    </div>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const wrapper = document.getElementById('wrapper');

const codeReader = new ZXing.BrowserMultiFormatReader();
const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";

let isProcessing = false;
let lastScan = 0;

async function initScanner() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment",
                // Resolusi 640x480 adalah "sweet spot" untuk scanner berbasis web
                width: { ideal: 640 }, 
                height: { ideal: 480 },
                // Memaksa frame rate lebih tinggi agar tidak patah-patah
                frameRate: { ideal: 30 } 
            }
        });

        video.srcObject = stream;
        await video.play();

        status.innerText = "Arahkan barcode ke kamera";

        // Konfigurasi tambahan untuk mempercepat ZXing
        const hints = new Map();
        // Menentukan format secara spesifik mempercepat proses pencarian algoritma
        const formats = [
            ZXing.BarcodeFormat.QR_CODE, 
            ZXing.BarcodeFormat.CODE_128, 
            ZXing.BarcodeFormat.EAN_13
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Mencoba lebih teliti namun tetap cepat pada resolusi rendah

        // Memulai scanner dengan hints
        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
            if (result && !isProcessing) {
                handleMatch(result.getText());
            }
            // Jika err, library akan terus mencoba frame berikutnya secara otomatis
        }, hints);

    } catch (err) {
        status.innerText = "Kamera tidak tersedia atau izin ditolak";
        console.error(err);
    }
}
    } catch (err) {
        status.innerText = "Kamera tidak tersedia";
    }
}

function handleMatch(kode) {
    const now = Date.now();

    // ⛔ cegah scan double
    if (now - lastScan < 2000) return;
    lastScan = now;

    isProcessing = true;

    wrapper.classList.add('capturing');
    if (navigator.vibrate) navigator.vibrate(150);

    status.innerText = "Terdeteksi: " + kode;

    fetch(`${API_URL}/search?sheet=Master&kode=${kode}`)
        .then(res => res.json())
        .then(data => {
            if (data.length > 0) {
                const siswa = data[0];

                Swal.fire({
                    title: 'BERHASIL',
                    text: siswa.nama,
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                });

                const skrg = new Date();

                // kirim log
                fetch(`${API_URL}?sheet=Log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "WAKTU": `${skrg.toLocaleTimeString()}, ${skrg.toLocaleDateString()}`,
                        "KODE": kode,
                        "NAMA": siswa.nama
                    })
                });

            } else {
                Swal.fire('Error', 'Siswa tidak ditemukan', 'error');
            }

            // ⏱ jeda scan (lebih cepat dari sebelumnya)
            setTimeout(() => {
                isProcessing = false;
                wrapper.classList.remove('capturing');
                status.innerText = "Siap scan...";
            }, 1500);
        });
}

window.onload = initScanner;
</script>

</body>
</html>
