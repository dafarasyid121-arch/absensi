<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner SMAN 2 Pare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1/1;
            margin: auto;
            border-radius: 2.5rem;
            overflow: hidden;
            border: 4px solid #3b82f6;
            background-color: #000;
        }

        .capturing {
            animation: flash 0.2s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            z-index: 10;
            animation: moveLine 2s infinite linear;
        }

        @keyframes moveLine {
            0% { top: 20%; }
            100% { top: 80%; }
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h1 class="text-2xl font-black mb-1">SMAN 2 PARE</h1>
        <p class="text-blue-400 text-[10px] font-bold tracking-[0.3em] mb-8 uppercase">
            Fast Realtime Scanner
        </p>

        <div id="wrapper" class="scanner-box shadow-2xl">
            <video id="video" playsinline></video>
            <div class="scan-line"></div>
        </div>

        <div class="mt-8">
            <p id="status" class="text-sm font-medium text-slate-400">
                Menunggu izin kamera...
            </p>
        </div>
    </div>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const wrapper = document.getElementById('wrapper');

const codeReader = new ZXing.BrowserMultiFormatReader();
const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";

let isProcessing = false;
let lastScan = 0;

async function initScanner() {
    try {
        // 1. Minta akses kamera secara eksplisit terlebih dahulu
        const constraints = {
            video: {
                facingMode: "environment",
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 30 }
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        // Pastikan video mulai diputar
        await video.play();
        status.innerText = "Arahkan barcode ke kamera";

        // 2. Konfigurasi Hints untuk mempercepat deteksi
        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.QR_CODE,
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.EAN_13
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);

        // 3. Mulai decoding
        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
            if (result && !isProcessing) {
                handleMatch(result.getText());
            }
        }, hints);

    } catch (err) {
        console.error(err);
        status.innerText = "Kamera Error: " + err.message;
        Swal.fire('Kamera Error', 'Pastikan izin kamera diberikan dan gunakan HTTPS', 'error');
    }
}

function handleMatch(kode) {
    const now = Date.now();
    if (now - lastScan < 2500) return; // Jeda antar scan
    lastScan = now;

    isProcessing = true;
    wrapper.classList.add('capturing');
    if (navigator.vibrate) navigator.vibrate(100);
    
    status.innerText = "Mengecek: " + kode;

    fetch(`${API_URL}/search?sheet=Master&kode=${kode}`)
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                const siswa = data[0];
                Swal.fire({
                    title: 'BERHASIL',
                    text: siswa.nama,
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                });

                const skrg = new Date();
                fetch(`${API_URL}?sheet=Log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "WAKTU": `${skrg.toLocaleTimeString()}, ${skrg.toLocaleDateString()}`,
                        "KODE": kode,
                        "NAMA": siswa.nama
                    })
                });
            } else {
                Swal.fire('Gagal', 'Kode tidak terdaftar', 'error');
            }
        })
        .catch(err => {
            console.error("Fetch Error:", err);
            status.innerText = "Koneksi Bermasalah";
        })
        .finally(() => {
            setTimeout(() => {
                isProcessing = false;
                wrapper.classList.remove('capturing');
                status.innerText = "Siap scan...";
            }, 1500);
        });
}

// Inisialisasi saat halaman selesai dimuat
window.addEventListener('load', initScanner);
</script>

</body>
</html>
