<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi SMAN 2 Pare - All Barcode</title>

    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* [SAMA PERSIS full screen tema hijau] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            height: 100vh; overflow: hidden; color: #1e293b;
        }
        .header { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 15px 25px; border-radius: 20px; border: 3px solid #d1fae5;
            box-shadow: 0 15px 35px rgba(16,185,129,0.3); text-align: center;
        }
        .header h1 { color: #047857; font-size: 1.4em; font-weight: 800; margin-bottom: 2px; }
        .header p { color: #6b7280; font-size: 0.85em; font-weight: 600; letter-spacing: 1px; }
        .scanner-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000;
        }
        .scanner-box { 
            position: relative; width: 90vw; max-width: 400px; height: 90vw; max-height: 400px;
            border-radius: 24px; overflow: hidden; border: 6px solid #10b981;
            box-shadow: 0 30px 60px -15px rgba(16,185,129,0.5), inset 0 2px 8px rgba(255,255,255,0.2);
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { 
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, #10b981, #059669, #10b981, transparent);
            box-shadow: 0 0 25px #10b981; animation: fastScan 0.4s infinite linear; z-index: 10;
        }
        @keyframes fastScan { 0% { top: 0%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .success-flash { 
            animation: successFlash 0.3s ease-out; 
            border-color: #059669 !important;
            box-shadow: 0 0 80px rgba(16,185,129,1), inset 0 4px 12px rgba(255,255,255,0.3) !important;
        }
        @keyframes successFlash { 
            0% { transform: scale(1); box-shadow: 0 0 80px rgba(16,185,129,1); }
            50% { transform: scale(1.02); box-shadow: 0 0 120px rgba(16,185,129,1); }
            100% { transform: scale(1); } 
        }
        #status { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 18px 30px; border-radius: 20px; border: 3px solid #d1fae5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); font-weight: 700; font-size: 1.1em;
            text-align: center; min-width: 280px; transition: all 0.2s ease;
        }
        .status-ready { color: #047857; }
        .status-scan { color: #92400e; background: rgba(254,243,199,0.95); border-color: #f59e0b; }
        .status-success { color: #059669; background: rgba(209,250,229,0.95); border-color: #10b981; }
    </style>
</head>

<body>
    <div class="header">
        <h1>SMAN 2 PARE</h1>
        <p>Scan Semua Barcode/QR</p>
    </div>

    <div class="scanner-container">
        <div id="scannerBox" class="scanner-box">
            <video id="video" playsinline muted></video>
            <div class="scan-line"></div>
        </div>
    </div>

    <div id="status" class="status-ready">QR Code / Barcode / Semua Format</div>

    <script>
        // GANTI API URL!
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const scannerBox = document.getElementById('scannerBox');
        
        let stream = null;
        let lastScan = 0;
        let isProcessing = false;

        // 🔥 ALL-IN-ONE MULTI FORMAT SCANNER
        const codeReader = new ZXing.BrowserMultiFormatReader(30, {
            // SUPPORT SEMUA FORMAT!
            formats: [
                ZXing.BarcodeFormat.QR_CODE,
                ZXing.BarcodeFormat.DATA_MATRIX,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,
                ZXing.BarcodeFormat.ITF,
                ZXing.BarcodeFormat.CODABAR,
                ZXing.BarcodeFormat.RSS_14,
                ZXing.BarcodeFormat.RSS_EXPANDED
            ],
            // ULTRA FAST SETTINGS
            timeBetweenScansMS: 30,  // ⚡ 30ms!
            tryHarder: true
        });

        async function initScanner() {
            status.textContent = '🔄 Mulai scanning...';
            status.className = 'status-scan';

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 60, max: 60 } // MAX SPEED!
                    }
                });
                
                video.srcObject = stream;
                await video.play();

                // 🔥 SCAN ALL FORMATS
                codeReader.decodeFromVideoDevice(
                    null, 
                    video, 
                    (result, err) => {
                        if (result && !isProcessing && (Date.now() - lastScan > 800)) {
                            processBarcode(result.text, result.formatResult.formatString);
                        }
                    }
                );

                status.innerHTML = '✅ <strong>Scan QR/Barcode apapun!</strong>';
                status.className = 'status-ready';

            } catch (e) {
                status.textContent = '❌ Kamera gagal';
                console.error('Camera error:', e);
            }
        }

        // 🔥 PROCESS ANY CODE TYPE
        async function processBarcode(kode, format) {
            isProcessing = true;
            lastScan = Date.now();
            scannerBox.classList.add('success-flash');

            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

            status.innerHTML = `🔍 ${format}<br>${kode.slice(0, 12)}...`;
            status.className = 'status-scan';

            try {
                // CEK DI MASTER SHEET
                const response = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const siswaData = await response.json();

                if (siswaData.length > 0) {
                    // ✅ SISWA DITEMUKAN
                    const siswa = siswaData[0];
                    const now = new Date();
                    const timestamp = now.toLocaleString('id-ID');

                    // SIMPAN LOG
                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "WAKTU": timestamp,
                            "KODE": kode,
                            "FORMAT": format,
                            "NAMA": siswa.NAMA,
                            "KELAS": siswa.KELAS,
                            "STATUS": "HADIR"
                        })
                    });

                    // SUCCESS FEEDBACK
                    Swal.fire({
                        title: '✅ PRESENSI BERHASIL',
                        html: `
                            <div style="text-align: center;">
                                <div style="font-size: 1.3em; font-weight: bold; margin-bottom: 8px;">
                                    ${siswa.NAMA}
                                </div>
                                <div style="opacity: 0.9;">
                                    ${format} | ${siswa.KELAS}
                                </div>
                            </div>
                        `,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false,
                        backdrop: false,
                        width: '90vw',
                        customClass: { popup: 'animate-pulse' }
                    });

                    status.innerHTML = `🎉 ${siswa.NAMA}<br>Siap scan lagi`;
                    status.className = 'status-success';

                } else {
                    // ❌ TIDAK TERDAFTAR
                    Swal.fire({
                        title: '⚠️ SISWA BARU',
                        html: `
                            <div style="text-align: center;">
                                <div style="font-size: 1.1em; margin-bottom: 4px;">
                                    ${kode}
                                </div>
                                <div style="opacity: 0.8; font-size: 0.9em;">
                                    ${format} - Belum terdaftar
                                </div>
                            </div>
                        `,
                        icon: 'warning',
                        timer: 2000,
                        showConfirmButton: false,
                        backdrop: false,
                        width: '90vw'
                    });

                    status.textContent = `${kode} - Tambah ke Master`;
                }

            } catch (error) {
                Swal.fire({
                    title: '❌ ERROR',
                    text: 'Cek koneksi/server',
                    icon: 'error',
                    timer: 1500,
                    showConfirmButton: false
                });
                status.textContent = 'Error - coba lagi';
            }

            // AUTO RESTART
            setTimeout(() => {
                scannerBox.classList.remove('success-flash');
                isProcessing = false;
                initScanner();
            }, 1500);
        }

        // 🔥 AUTO START
        window.addEventListener('load', initScanner);

        // CLEANUP
        window.addEventListener('pagehide', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            codeReader.reset();
        });
    </script>
</body>
</html>
