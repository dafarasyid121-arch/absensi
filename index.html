<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .scan-wrapper { 
            position: relative; width: 100%; max-width: 350px; aspect-ratio: 1/1; 
            margin: auto; border-radius: 2rem; overflow: hidden; border: 4px solid #1e293b;
        }
        .laser-line {
            position: absolute; top: 50%; left: 0; right: 0; height: 4px;
            background: #ff0000; box-shadow: 0 0 15px #ff0000; z-index: 20;
            animation: scanAnim 2.5s infinite linear;
        }
        @keyframes scanAnim {
            0% { transform: translateY(-120px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(120px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h2 class="text-2xl font-black mb-2 tracking-widest text-blue-500">SYSTEM SCANNER</h2>
        <p class="text-xs text-slate-500 mb-8 font-bold uppercase">SMAN 2 PARE • VERSION 4.0</p>

        <div class="scan-wrapper shadow-2xl">
            <video id="video" playsinline></video>
            <div class="laser-line"></div>
        </div>

        <div class="mt-10 space-y-4">
            <p id="status" class="text-sm font-mono text-slate-400">Status: Initializing...</p>
            <div class="flex gap-2 justify-center">
                <button onclick="forceStart()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold text-sm">PAKSA START</button>
                <button onclick="location.reload()" class="bg-slate-800 px-6 py-3 rounded-xl font-bold text-sm">RELOAD</button>
            </div>
        </div>
    </div>

    <script>
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        let isLocked = false;

        async function forceStart() {
            const status = document.getElementById('status');
            status.innerText = "Memaksa akses kamera...";

            try {
                // Mencoba mendapatkan stream manual terlebih dahulu untuk "membangunkan" hardware
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { exact: "environment" } 
                    } 
                }).catch(() => {
                    // Fallback jika 'exact environment' gagal (untuk beberapa tipe HP)
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                
                status.innerText = "Kamera Terhubung. Mencari Barcode...";
                startDecoding();
            } catch (err) {
                status.innerText = "Gagal: " + err.name;
                Swal.fire('Hardware Error', 'Kamera mungkin sedang digunakan aplikasi lain atau tidak mendukung akses web.', 'error');
            }
        }

        function startDecoding() {
            codeReader.decodeFromVideoElement(document.getElementById('video'), (result, err) => {
                if (result && !isLocked) {
                    isLocked = true;
                    processData(result.getText());
                }
            });
        }

        function processData(kode) {
            if (navigator.vibrate) navigator.vibrate(200);
            document.getElementById('status').innerText = "Scanning: " + kode;

            fetch(`${API_URL}/search?sheet=Master&kode=${kode}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        const siswa = data[0];
                        Swal.fire({ title: 'SUKSES', text: `Selamat Datang, ${siswa.nama}`, icon: 'success', timer: 2000, showConfirmButton: false });
                        
                        // Log ke sheet
                        const d = new Date();
                        fetch(`${API_URL}?sheet=Log`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                "WAKTU": `${d.toLocaleTimeString()}, ${d.toLocaleDateString()}`, 
                                "KODE": kode, 
                                "NAMA": siswa.nama 
                            })
                        });
                    } else {
                        Swal.fire('Error', 'ID Tidak Terdaftar', 'error');
                    }
                    setTimeout(() => { isLocked = false; }, 3000);
                });
        }

        // Jalankan otomatis saat load
        window.addEventListener('load', forceStart);
    </script>
</body>
</html>
