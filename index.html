<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi SMAN 2 Pare</title>

    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
        }

        .header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 15px 25px;
            border-radius: 20px;
            border: 3px solid #d1fae5;
            box-shadow: 0 15px 35px rgba(16,185,129,0.3);
            text-align: center;
        }

        .header h1 {
            color: #047857;
            font-size: 1.4em;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .header p {
            color: #6b7280;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .scanner-box {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: 90vw;
            max-height: 400px;
            border-radius: 24px;
            overflow: hidden;
            border: 6px solid #10b981;
            box-shadow: 
                0 30px 60px -15px rgba(16,185,129,0.5),
                inset 0 2px 8px rgba(255,255,255,0.2);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ⚡ ULTRA FAST GREEN SCAN LINE */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #10b981 25%, 
                #059669 50%, 
                #10b981 75%, 
                transparent 100%);
            box-shadow: 0 0 25px #10b981;
            animation: fastScan 0.6s infinite linear;
            z-index: 10;
        }

        @keyframes fastScan {
            0% { top: 0%; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .success-flash {
            animation: successFlash 0.5s ease-out;
            border-color: #059669 !important;
            box-shadow: 
                0 0 80px rgba(16,185,129,1),
                inset 0 4px 12px rgba(255,255,255,0.3) !important;
        }

        @keyframes successFlash {
            0% { 
                transform: scale(1);
                box-shadow: 0 0 80px rgba(16,185,129,1);
            }
            50% { 
                transform: scale(1.02);
                box-shadow: 0 0 120px rgba(16,185,129,1);
            }
            100% { 
                transform: scale(1);
            }
        }

        #status {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 18px 30px;
            border-radius: 20px;
            border: 3px solid #d1fae5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            font-weight: 700;
            font-size: 1.1em;
            text-align: center;
            min-width: 280px;
            transition: all 0.3s ease;
        }

        .status-ready { color: #047857; }
        .status-scan { 
            color: #92400e; 
            background: rgba(254,243,199,0.95); 
            border-color: #f59e0b; 
        }
        .status-success { 
            color: #059669; 
            background: rgba(209,250,229,0.95); 
            border-color: #10b981; 
        }

        /* Mobile Perfect */
        @media (max-width: 480px) {
            .header h1 { font-size: 1.3em; }
            .header p { font-size: 0.8em; }
            .scanner-box { width: 95vw; height: 95vw; }
        }

        /* Landscape */
        @media (orientation: landscape) and (max-height: 500px) {
            .header { 
                position: absolute; 
                top: 10px; 
                font-size: 0.9em; 
                padding: 10px 15px; 
            }
            #status { 
                position: absolute; 
                bottom: 10px; 
                font-size: 1em; 
                padding: 12px 20px; 
            }
        }
    </style>
</head>

<body>
    <!-- Header Fixed -->
    <div class="header">
        <h1>SMAN 2 PARE</h1>
        <p>Presensi Digital</p>
    </div>

    <!-- FULLSCREEN Scanner -->
    <div class="scanner-container">
        <div id="scannerBox" class="scanner-box">
            <video id="video" playsinline muted></video>
            <div class="scan-line"></div>
        </div>
    </div>

    <!-- Status Bottom Fixed -->
    <div id="status" class="status-ready">
        Arahkan barcode ke kamera
    </div>

    <script>
        // ⚙️ GANTI API INI!
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const scannerBox = document.getElementById('scannerBox');

        const codeReader = new ZXing.BrowserMultiFormatReader();
        let isScanning = false;
        let stream = null;
        let lastScan = 0;

        // 🚀 ULTRA FAST START
        async function startScanner() {
            if (isScanning) return;

            status.textContent = '🔄 Kamera aktif...';
            status.className = 'status-scan';

            // Optimized constraints
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: 640,
                    height: 480,
                    frameRate: { ideal: 30 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                // ⚡ SUPER FAST ZXING
                codeReader.timeBetweenScansMS = 50; // 20x faster!
                codeReader.decodeFromVideoDevice(null, video, handleResult);

                isScanning = true;
                status.textContent = '✅ Scan barcode siswa';
                status.className = 'status-ready';

            } catch (e) {
                status.textContent = '❌ Kamera gagal';
                console.error(e);
            }
        }

        // ⚡ HANDLE RESULT - 0.3s!
        function handleResult(result, error) {
            if (result && (Date.now() - lastScan > 1000)) {
                processBarcode(result.getText());
            }
        }

        async function processBarcode(kode) {
            lastScan = Date.now();
            isScanning = false;
            scannerBox.classList.add('success-flash');

            if (navigator.vibrate) navigator.vibrate(200);

            status.textContent = `Verifikasi ${kode.slice(0,8)}...`;
            status.className = 'status-scan';

            try {
                // Parallel API calls
                const [siswaData] = await Promise.all([
                    fetch(`${API_URL}/search?sheet=Master&kode=${kode}`)
                        .then(r => r.json())
                ]);

                if (siswaData.length > 0) {
                    const siswa = siswaData[0];
                    const now = new Date();
                    const timestamp = now.toLocaleString('id-ID');

                    // Save presensi
                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "WAKTU": timestamp,
                            "KODE": kode,
                            "NAMA": siswa.nama,
                            "STATUS": "HADIR"
                        })
                    });

                    // Success popup
                    Swal.fire({
                        title: '✅ HADIR!',
                        html: `<div class="text-center">
                            <div class="font-bold text-xl mb-1">${siswa.nama}</div>
                            <div class="text-sm opacity-75">${kode}</div>
                        </div>`,
                        icon: 'success',
                        timer: 1800,
                        showConfirmButton: false,
                        backdrop: false,
                        width: '320px'
                    });

                    status.textContent = '🎉 Siap scan berikutnya!';
                    status.className = 'status-success';

                } else {
                    throw new Error(`Kode ${kode} tidak ditemukan`);
                }

            } catch (err) {
                Swal.fire({
                    title: '❌ Gagal',
                    text: err.message,
                    icon: 'error',
                    timer: 1500,
                    showConfirmButton: false,
                    width: '320px'
                });
                status.textContent = 'Coba scan lagi';
            }

            // Auto restart scanning
            setTimeout(() => {
                scannerBox.classList.remove('success-flash');
                if (stream) startScanner(); // Auto resume
            }, 2000);
        }

        // Auto start on load
        window.addEventListener('load', startScanner);

        // Cleanup
        window.addEventListener('pagehide', () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            codeReader.reset();
        });
    </script>
</body>
</html>
