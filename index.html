<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner SMAN 2 Pare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-box {
            position: relative; width: 100%; max-width: 320px; aspect-ratio: 1/1;
            margin: auto; border-radius: 2.5rem; overflow: hidden;
            border: 4px solid #3b82f6; background-color: #000;
        }
        .capturing { animation: flash 0.2s ease-out; }
        @keyframes flash { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .scan-line {
            position: absolute; top: 50%; left: 0; right: 0; height: 2px;
            background: #3b82f6; box-shadow: 0 0 15px #3b82f6; z-index: 10;
            animation: moveLine 2s infinite linear;
        }
        @keyframes moveLine { 0% { top: 20%; } 100% { top: 80%; } }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h1 class="text-2xl font-black mb-1">SMAN 2 PARE</h1>
        <p class="text-blue-400 text-[10px] font-bold tracking-[0.3em] mb-8 uppercase">Fast Realtime Absensi</p>

        <div id="wrapper" class="scanner-box shadow-2xl">
            <video id="video" playsinline></video>
            <div class="scan-line"></div>
        </div>

        <div class="mt-8">
            <p id="status" class="text-sm font-medium text-slate-400">Menghubungkan ke database...</p>
        </div>
    </div>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const wrapper = document.getElementById('wrapper');

const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
const codeReader = new ZXing.BrowserMultiFormatReader();
let isProcessing = false;

async function initScanner() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
        });
        video.srcObject = stream;
        await video.play();
        status.innerText = "Arahkan barcode kartu ke kamera";

        const hints = new Map();
        // Fokus hanya pada format Code 128 (seperti di foto) dan QR Code agar cepat
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, false); 

        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
            if (result && !isProcessing) handleAbsensi(result.getText());
        }, hints);
    } catch (err) {
        status.innerText = "Kamera tidak aktif. Gunakan HTTPS.";
    }
}

function handleAbsensi(kode) {
    const now = new Date();
    const tglHariIni = now.toLocaleDateString('id-ID'); // Format: DD/MM/YYYY
    const waktuSekarang = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}, ${tglHariIni}`;

    isProcessing = true;
    wrapper.classList.add('capturing');
    if (navigator.vibrate) navigator.vibrate(100);
    
    status.innerText = "Memeriksa riwayat...";

    // 1. Cek apakah sudah absen hari ini di sheet 'Log'
    fetch(`${API_URL}/search?sheet=Log&WAKTU=*${tglHariIni}*&KODE=${kode}`)
        .then(res => res.json())
        .then(logs => {
            if (logs && logs.length > 0) {
                Swal.fire({ title: 'SUDAH ABSEN', text: 'Anda sudah melakukan presensi hari ini.', icon: 'warning', timer: 2500, showConfirmButton: false });
                resetScanner();
            } else {
                // 2. Jika belum, ambil data nama dari sheet 'Master'[cite: 1]
                fetch(`${API_URL}/search?sheet=Master&KODE=${kode}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const siswa = data[0];
                            Swal.fire({
                                title: 'BERHASIL ABSEN',
                                html: `<b class="text-xl">${siswa.NAMA}</b><br>Kelas: ${siswa.KELAS}<br><small>${waktuSekarang}</small>`,
                                icon: 'success', timer: 2000, showConfirmButton: false
                            });

                            // 3. Simpan ke sheet 'Log'[cite: 1]
                            fetch(`${API_URL}?sheet=Log`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ "NO": "INCREMENT", "WAKTU": waktuSekarang, "KODE": kode, "NAMA": siswa.NAMA })
                            });
                        } else {
                            Swal.fire('GAGAL', 'Kartu tidak terdaftar!', 'error');
                        }
                        resetScanner();
                    });
            }
        }).catch(() => { status.innerText = "Gangguan koneksi database."; resetScanner(); });
}

function resetScanner() {
    setTimeout(() => { isProcessing = false; wrapper.classList.remove('capturing'); status.innerText = "Siap scan berikutnya..."; }, 2500);
}

window.addEventListener('load', initScanner);
</script>
</body>
</html>
