<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Container kamera */
        #interactive.viewport { position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 2rem; }
        #interactive.viewport > canvas, #interactive.viewport > video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        /* Garis Bidik AI */
        .target-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 40%; border: 2px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); z-index: 10; border-radius: 1rem;
        }
        .target-line {
            position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
            background: #3b82f6; box-shadow: 0 0 15px #3b82f6; animation: scanLine 1.5s infinite;
        }
        @keyframes scanLine {
            0% { transform: translateY(-40px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(40px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl border border-slate-800">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black tracking-tight">PRESENSI SISWA</h1>
            <p class="text-blue-500 text-xs font-bold tracking-[0.3em]">SMAN 2 PARE • AI ENGINE</p>
        </div>

        <div class="relative overflow-hidden rounded-[2rem] border-2 border-slate-700 bg-black">
            <div id="interactive" class="viewport"></div>
            <div class="target-box">
                <div class="target-line"></div>
            </div>
        </div>

        <div id="status-container" class="mt-6 p-4 bg-slate-800/50 rounded-2xl border border-white/5 text-center">
            <p id="status-text" class="text-blue-400 font-medium text-sm italic">Menghubungkan Kamera...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        let isLock = false;

        // Konfigurasi Engine Pemindai (Quagga)
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: {
                    facingMode: "environment",
                    aspectRatio: { min: 1, max: 2 }
                },
            },
            decoder: {
                // Mendukung SEMUA jenis barcode umum
                readers: [
                    "code_128_reader", 
                    "ean_reader", 
                    "code_39_reader", 
                    "code_39_vin_reader", 
                    "codabar_reader", 
                    "upc_reader", 
                    "upc_e_reader", 
                    "i2of5_reader"
                ]
            },
            locate: true // Menggunakan AI untuk melokalisasi posisi barcode meski miring
        }, function(err) {
            if (err) {
                document.getElementById('status-text').innerText = "Gagal memuat kamera.";
                return;
            }
            Quagga.start();
            document.getElementById('status-text').innerText = "AI Ready: Posisikan Barcode";
        });

        // Deteksi Berhasil
        Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            
            if (isLock || !code) return;
            
            // Validasi sederhana agar tidak asal scan kode panjang produk (EAN-13)
            // Sesuaikan jika NIS Anda ternyata lebih dari 10 digit
            if (code.length > 10) return;

            isLock = true;
            vibrate();
            prosesAbsensi(code);
        });

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(100);
        }

        async function prosesAbsensi(kode) {
            document.getElementById('status-text').innerText = "MEMVERIFIKASI: " + kode;

            try {
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    const siswa = data[0];
                    const sekarang = new Date();
                    const waktuLog = `${sekarang.toLocaleTimeString('id-ID').replace(/\./g, ':')}, ${sekarang.toLocaleDateString('id-ID')}`;

                    // Kirim Log ke Sheets
                    fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "WAKTU": waktuLog, "KODE": kode, "NAMA": siswa.nama })
                    });

                    Swal.fire({
                        title: 'BERHASIL',
                        text: `Selamat Datang, ${siswa.nama}!`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Data Tidak Ada', `Kode ${kode} tidak ditemukan.`, 'warning');
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "Koneksi Bermasalah";
            } finally {
                setTimeout(() => {
                    isLock = false;
                    document.getElementById('status-text').innerText = "AI Ready: Posisikan Barcode";
                }, 3000);
            }
        }
    </script>
</body>
</html>
