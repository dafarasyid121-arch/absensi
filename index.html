<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Presensi SMAN 2 Pare</title>
    
    <!-- HTTPS ONLY warning -->
    <script>if(location.protocol!=='https:'&&location.hostname!=='localhost')document.write('<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;text-align:center;z-index:9999;padding:10px;font-weight:bold">HTTPS REQUIRED! Upload ke GitHub Pages</div>');</script>

    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);height:100vh;overflow:hidden;color:#1e293b;}
        .header{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);padding:12px 20px;border-radius:16px;border:2px solid #d1fae5;box-shadow:0 10px 30px rgba(16,185,129,0.3);text-align:center;}
        .header h1{color:#047857;font-size:1.3em;font-weight:800;margin-bottom:0;}
        .header p{color:#6b7280;font-size:0.8em;font-weight:600;letter-spacing:.5px;}
        .scanner-container{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;}
        .scanner-box{position:relative;width:92vw;max-width:420px;height:92vw;max-height:420px;border-radius:20px;overflow:hidden;border:4px solid #10b981;box-shadow:0 20px 40px rgba(16,185,129,0.4),inset 0 1px 4px rgba(255,255,255,0.2);background:#111;}
        #video{width:100%;height:100%;object-fit:cover;background:radial-gradient(circle,#222 0%,#000 70%);}
        .scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#10b981,#059669,#10b981,transparent);box-shadow:0 0 20px #10b981;animation:scan 0.5s infinite linear;z-index:10;}
        @keyframes scan{0%{top:0%;opacity:1;}100%{top:100%;opacity:0;}}
        .success-flash{animation:flash 0.4s ease-out;border-color:#059669!important;box-shadow:0 0 60px rgba(16,185,129,1)!important;}
        @keyframes flash{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
        #status{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);padding:15px 25px;border-radius:16px;border:2px solid #d1fae5;box-shadow:0 15px 35px rgba(0,0,0,0.2);font-weight:700;font-size:1em;text-align:center;min-width:260px;max-width:90vw;transition:all .2s;}
        .status-ready{color:#047857;border-color:#10b981;}
        .status-scan{color:#d97706;background:rgba(254,243,199,0.98);border-color:#f59e0b;}
        .status-success{color:#059669;background:rgba(209,250,229,0.98);border-color:#10b981;}
        .status-error{color:#dc2626;background:rgba(254,226,226,0.98);border-color:#ef4444;}
        .spinner{width:20px;height:20px;border:2px solid #d1d5db;border-top:2px solid #10b981;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-right:6px;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        .btn-retry{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(45deg,#10b981,#059669);color:white;border:none;padding:15px 30px;border-radius:12px;font-weight:700;font-size:1.1em;cursor:pointer;box-shadow:0 10px 25px rgba(16,185,129,0.4);display:none;z-index:200;}
        .btn-retry:hover{transform:translate(-50%,-52%) scale(1.05);}
    </style>
</head>

<body>
    <div class="header">
        <h1>SMAN 2 PARE</h1>
        <p>Presensi Digital</p>
    </div>

    <div class="scanner-container">
        <div id="scannerBox" class="scanner-box">
            <video id="video" playsinline muted></video>
            <div class="scan-line" style="display:none;"></div>
        </div>
    </div>

    <div id="status" class="status-error">
        <span class="spinner"></span>Minta izin kamera...
    </div>

    <button id="retryBtn" class="btn-retry" onclick="initScanner()">🔄 Coba Lagi</button>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr"; // GANTI!
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const scannerBox = document.getElementById('scannerBox');
        const scanLine = scannerBox.querySelector('.scan-line');
        const retryBtn = document.getElementById('retryBtn');
        
        let stream = null;
        let codeReader = null;
        let lastScan = 0;
        let isProcessing = false;

        // 🔥 ULTIMATE CAMERA FIX
        async function requestCamera() {
            const configs = [
                {video: {facingMode: "environment"}},
                {video: {facingMode: "user"}}, 
                {video: {width: 640, height: 480}},
                {video: true},
                {video: {width: {ideal: 1280}, height: {ideal: 720}}}
            ];

            for(let i = 0; i < configs.length; i++) {
                try {
                    status.innerHTML = `<span class="spinner"></span>Coba kamera ${i+1}/5...`;
                    
                    stream = await navigator.mediaDevices.getUserMedia(configs[i]);
                    video.srcObject = stream;
                    
                    // Wait for video
                    await new Promise(resolve => {
                        if(video.videoWidth > 0) return resolve();
                        video.onloadedmetadata = () => resolve();
                        setTimeout(resolve, 2000);
                    });
                    
                    console.log('✅ KAMERA AKTIF:', configs[i]);
                    return true;
                    
                } catch(e) {
                    console.warn(`Kamera ${i+1} gagal:`, e);
                }
            }
            return false;
        }

        // 🚀 START SCANNING
        async function initScanner() {
            retryBtn.style.display = 'none';
            status.className = 'status-error';
            
            const cameraOK = await requestCamera();
            if(!cameraOK) {
                status.innerHTML = '❌ KAMERA GAGAL<br>Gunakan Chrome/Safari<br><small>Klik "Coba Lagi"</small>';
                retryBtn.style.display = 'block';
                return;
            }

            // 🔥 ZXING ALL FORMATS
            if(codeReader) codeReader.reset();
            codeReader = new ZXing.BrowserMultiFormatReader(20); // ⚡ 20ms!
            
            codeReader.decodeFromVideoDevice(
                null, video,
                (result, err) => {
                    if(result && !isProcessing && Date.now() - lastScan > 1200) {
                        processBarcode(result.text, result.formatResult?.formatString || 'UNKNOWN');
                    }
                }
            );

            scanLine.style.display = 'block';
            status.innerHTML = '✅ <strong>Scan QR/Barcode!</strong>';
            status.className = 'status-ready';
        }

        // 🔥 PROCESS
        async function processBarcode(kode, format) {
            isProcessing = true;
            lastScan = Date.now();
            scannerBox.classList.add('success-flash');
            
            if('vibrate' in navigator) navigator.vibrate(200);

            status.innerHTML = `🔍 ${format}<br>${kode.slice(0,12)}...`;
            status.className = 'status-scan';

            try {
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await res.json();

                if(data.length > 0) {
                    const siswa = data[0];
                    const now = new Date();
                    const time = now.toLocaleString('id-ID');

                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            "WAKTU": time,
                            "KODE": kode,
                            "FORMAT": format,
                            "NAMA": siswa.NAMA || siswa.nama || 'N/A',
                            "KELAS": siswa.KELAS || siswa.kelas || 'N/A',
                            "STATUS": "HADIR"
                        })
                    });

                    Swal.fire({
                        title: '✅ HADIR!',
                        html: `<b style="font-size:1.2em">${siswa.NAMA || siswa.nama}</b><br>
                               <small>${format} | ${siswa.KELAS || siswa.kelas}</small>`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false,
                        backdrop: false,
                        width: '95vw'
                    });

                    status.innerHTML = `🎉 ${siswa.NAMA || siswa.nama}`;
                    status.className = 'status-success';

                } else {
                    Swal.fire({
                        title: '⚠️ BARU',
                        html: `<code>${kode}</code><br><small>${format}</small>`,
                        icon: 'warning',
                        timer: 2000,
                        showConfirmButton: false,
                        backdrop: false
                    });
                    status.innerHTML = `${kode}<br>Tambah ke Master`;
                }

            } catch(e) {
                Swal.fire('❌ ERROR', 'Server down', 'error');
                status.textContent = 'Cek internet';
            }

            setTimeout(() => {
                scannerBox.classList.remove('success-flash');
                isProcessing = false;
                initScanner();
            }, 1800);
        }

        // 🔥 AUTO START
        if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
            window.addEventListener('load', initScanner);
        } else {
            status.innerHTML = '❌ Browser tidak support kamera';
        }

        // 🔄 AUTO RETRY
        setInterval(() => {
            if(!isScanning) initScanner();
        }, 4000);
    </script>
</body>
</html>
