<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner SMAN 2 Pare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1/1;
            margin: auto;
            border-radius: 2.5rem;
            overflow: hidden;
            border: 4px solid #3b82f6;
            background-color: #000;
        }

        .capturing {
            animation: flash 0.2s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            z-index: 10;
            animation: moveLine 2s infinite linear;
        }

        @keyframes moveLine {
            0% { top: 20%; }
            100% { top: 80%; }
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h1 class="text-2xl font-black mb-1">SMAN 2 PARE</h1>
        <p class="text-blue-400 text-[10px] font-bold tracking-[0.3em] mb-8 uppercase">
            Fast Realtime Absensi
        </p>

        <div id="wrapper" class="scanner-box shadow-2xl">
            <video id="video" playsinline></video>
            <div class="scan-line"></div>
        </div>

        <div class="mt-8">
            <p id="status" class="text-sm font-medium text-slate-400">
                Menghubungkan ke sistem...
            </p>
        </div>
    </div>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const wrapper = document.getElementById('wrapper');

// Ganti URL ini dengan API SheetDB Anda jika berubah
const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";

const codeReader = new ZXing.BrowserMultiFormatReader();
let isProcessing = false;

async function initScanner() {
    try {
        const constraints = {
            video: {
                facingMode: "environment",
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 30 }
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        status.innerText = "Arahkan kartu ke kamera";

        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.QR_CODE,
            ZXing.BarcodeFormat.EAN_13
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, false); 

        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
            if (result && !isProcessing) {
                handleAbsensi(result.getText());
            }
        }, hints);

    } catch (err) {
        console.error(err);
        status.innerText = "Error: Kamera tidak terdeteksi.";
    }
}

function handleAbsensi(kode) {
    const now = new Date();
    // Format tanggal ID-ID: DD/MM/YYYY
    const tglCek = now.toLocaleDateString('id-ID'); 
    // Format Waktu: Jam, Tanggal (sesuai permintaan)
    const jam = now.getHours().toString().padStart(2, '0');
    const menit = now.getMinutes().toString().padStart(2, '0');
    const waktuLog = `${jam}:${menit}, ${tglCek}`;

    isProcessing = true;
    wrapper.classList.add('capturing');
    if (navigator.vibrate) navigator.vibrate(100);
    
    status.innerText = "Mengecek riwayat hari ini...";

    // 1. CEK DUPLIKAT (Apakah sudah absen hari ini di sheet Log)
    // SheetDB akan mencari kecocokan tglCek di dalam kolom WAKTU
    fetch(`${API_URL}/search?sheet=Log&WAKTU=*${tglCek}*&KODE=${kode}`)
        .then(res => res.json())
        .then(logs => {
            if (logs && logs.length > 0) {
                Swal.fire({
                    title: 'SUDAH ABSEN',
                    text: 'Kartu ini sudah digunakan hari ini.',
                    icon: 'warning',
                    timer: 2500,
                    showConfirmButton: false
                });
                resetScanner();
            } else {
                // 2. JIKA BELUM, CARI DATA DI MASTER
                prosesDataMaster(kode, waktuLog);
            }
        })
        .catch(err => {
            status.innerText = "Koneksi database terputus.";
            resetScanner();
        });
}

function prosesDataMaster(kode, waktuLog) {
    status.innerText = "Mencari data siswa...";
    
    fetch(`${API_URL}/search?sheet=Master&KODE=${kode}`)
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                const siswa = data[0];

                Swal.fire({
                    title: 'BERHASIL ABSEN',
                    html: `<b class="text-xl">${siswa.NAMA}</b><br>Kelas: ${siswa.KELAS}<br><small>${waktuLog}</small>`,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                });

                // 3. KIRIM LOG KE TAB "Log"
                fetch(`${API_URL}?sheet=Log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "NO": "INCREMENT",
                        "WAKTU": waktuLog,
                        "KODE": kode,
                        "NAMA": siswa.NAMA
                    })
                });
            } else {
                Swal.fire('GAGAL', 'Kode kartu tidak terdaftar!', 'error');
            }
            resetScanner();
        });
}

function resetScanner() {
    setTimeout(() => {
        isProcessing = false;
        wrapper.classList.remove('capturing');
        status.innerText = "Siap scan berikutnya...";
    }, 2500);
}

window.addEventListener('load', initScanner);
</script>

</body>
</html>
