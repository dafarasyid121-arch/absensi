<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #020617; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 2rem; }
        .scanner-frame {
            position: relative; width: 100%; max-width: 350px; aspect-ratio: 1/1;
            margin: auto; border: 2px solid #1e293b; border-radius: 2.5rem; overflow: hidden;
        }
        /* Overlay seperti Google Lens */
        .lens-corner {
            position: absolute; width: 30px; height: 30px; border: 4px solid #3b82f6; z-index: 20;
        }
        .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
        .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
        .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
        .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
        
        .scan-bar {
            position: absolute; width: 100%; height: 2px; background: #3b82f6;
            box-shadow: 0 0 20px #3b82f6; animation: scanMove 1.5s infinite linear;
        }
        @keyframes scanMove { 0% { top: 10%; } 100% { top: 90%; } }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center">
        <h1 class="text-3xl font-black tracking-tighter text-white mb-1">PRESENSI SISWA</h1>
        <p class="text-blue-500 text-xs font-bold tracking-[0.4em] mb-8 uppercase">SMAN 2 PARE • NATIVE AI</p>

        <div class="scanner-frame shadow-[0_0_50px_rgba(59,130,246,0.2)] bg-black">
            <video id="video" autoplay playsinline></video>
            <div class="lens-corner tl"></div><div class="lens-corner tr"></div>
            <div class="lens-corner bl"></div><div class="lens-corner br"></div>
            <div class="scan-bar"></div>
        </div>

        <div class="mt-8 p-4 bg-slate-900/50 rounded-2xl border border-slate-800">
            <p id="status" class="text-blue-400 font-bold text-sm tracking-wide">MENCARI BARCODE...</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        let isScanning = true;

        // Mendukung semua format barcode populer
        const barcodeDetector = new BarcodeDetector({
            formats: ['code_128', 'code_39', 'ean_13', 'qr_code']
        });

        // 1. Jalankan Kamera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" } 
                });
                video.srcObject = stream;
                render();
            } catch (err) {
                statusText.innerText = "Kamera tidak diizinkan.";
            }
        }

        // 2. Loop Deteksi (Native Speed)
        async function render() {
            if (isScanning) {
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        const code = barcodes[0].rawValue;
                        // Filter agar tidak salah scan barcode belanjaan
                        if (code.length <= 10) {
                            handleMatch(code);
                        }
                    }
                } catch (e) { /* Loop deteksi */ }
            }
            requestAnimationFrame(render);
        }

        function handleMatch(kode) {
            isScanning = false;
            if (navigator.vibrate) navigator.vibrate(100);
            prosesAbsensi(kode);
        }

        async function prosesAbsensi(kode) {
            statusText.innerText = "VERIFIKASI: " + kode;
            
            try {
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    const siswa = data[0];
                    const sekarang = new Date();
                    const jam = sekarang.toLocaleTimeString('id-ID').replace(/\./g, ':');
                    const tgl = sekarang.toLocaleDateString('id-ID');

                    // Post Log ke Google Sheets
                    fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "WAKTU": `${jam}, ${tgl}`, "KODE": kode, "NAMA": siswa.nama })
                    });

                    Swal.fire({
                        title: 'BERHASIL',
                        text: `Selamat Datang, ${siswa.nama}!`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Gagal', `Kode ${kode} tidak terdaftar.`, 'error');
                }
            } catch (err) {
                statusText.innerText = "Gangguan Jaringan";
            } finally {
                setTimeout(() => {
                    isScanning = true;
                    statusText.innerText = "MENCARI BARCODE...";
                }, 3000);
            }
        }

        startCamera();
    </script>
</body>
</html>
