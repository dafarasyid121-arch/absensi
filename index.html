<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #reader video { border-radius: 2rem; object-fit: cover; filter: contrast(1.2) brightness(1.1); }
        .scanner-container { position: relative; width: 100%; max-width: 400px; }
        /* Animasi Fokus AI */
        .ai-focus-corner {
            position: absolute; width: 40px; height: 40px; border: 4px solid #3b82f6; z-index: 20;
            transition: all 0.3s ease; opacity: 0.7;
        }
        .top-left { top: 20px; left: 20px; border-right: 0; border-bottom: 0; border-radius: 1rem 0 0 0; }
        .top-right { top: 20px; right: 20px; border-left: 0; border-bottom: 0; border-radius: 0 1rem 0 0; }
        .bottom-left { bottom: 20px; left: 20px; border-right: 0; border-top: 0; border-radius: 0 0 0 1rem; }
        .bottom-right { bottom: 20px; right: 20px; border-left: 0; border-top: 0; border-radius: 0 0 1rem 0; }
        
        .scanning-line {
            position: absolute; left: 10%; right: 10%; height: 2px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            box-shadow: 0 0 15px #3b82f6; animation: scanMove 2s infinite ease-in-out; z-index: 15;
        }
        @keyframes scanMove { 0% { top: 25%; } 50% { top: 75%; } 100% { top: 25%; } }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#0f172a] p-8 rounded-[3rem] shadow-[0_0_50px_rgba(30,58,138,0.3)] border border-slate-800 text-center">
        <h1 class="text-3xl font-black tracking-tighter mb-1 text-white">PRESENSI SISWA</h1>
        <p class="text-blue-500 text-xs font-bold uppercase tracking-[0.3em] mb-8">AI Vision System</p>
        
        <div class="scanner-container mx-auto">
            <div id="reader" class="overflow-hidden rounded-[2.5rem] bg-black border-2 border-slate-800"></div>
            
            <!-- AI Focus Overlays -->
            <div class="ai-focus-corner top-left"></div>
            <div class="ai-focus-corner top-right"></div>
            <div class="ai-focus-corner bottom-left"></div>
            <div class="ai-focus-corner bottom-right"></div>
            <div class="scanning-line"></div>
        </div>

        <div id="status-box" class="mt-8 p-4 bg-slate-900/80 rounded-2xl border border-slate-700">
            <p id="result-label" class="text-blue-400 font-bold text-sm">MENGAKTIFKAN AI SCANNER...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        let isProcessing = false;

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            
            // Filter: Hanya terima Kode 128 (panjang karakter NIS biasanya 5-8)
            if (decodedText.length > 10) return;

            isProcessing = true;
            html5QrCode.pause(true);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            prosesAbsensi(decodedText);
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { 
            fps: 60, // Kecepatan maksimal
            qrbox: { width: 280, height: 150 },
            aspectRatio: 1.0,
            // Mengoptimalkan pembacaan barcode Code 128 (format kartu SMAN 2 Pare)
            formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ]
        };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                document.getElementById('result-label').innerText = "AI READY: POSISIKAN BARCODE";
            });

        async function prosesAbsensi(kode) {
            const cleanKode = kode.trim();
            document.getElementById('result-label').innerText = "VERIFIKASI DATA...";

            try {
                // Gunakan timeout agar tidak hang jika sinyal buruk
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${cleanKode}`, { signal: AbortSignal.timeout(5000) });
                const data = await res.json();

                if (data && data.length > 0) {
                    const siswa = data[0];
                    const sekarang = new Date();
                    const waktuLog = `${sekarang.toLocaleTimeString('id-ID').replace(/\./g, ':')}, ${sekarang.toLocaleDateString('id-ID')}`;

                    // Kirim ke Log (Background Task)
                    fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "WAKTU": waktuLog, "KODE": cleanKode, "NAMA": siswa.nama })
                    });

                    Swal.fire({
                        title: 'BERHASIL!',
                        html: `<div class="p-2 text-slate-700">
                                <p class="text-2xl font-bold text-blue-600">${siswa.nama}</p>
                                <p class="text-sm">Kelas ${siswa.kelas}</p>
                                <p class="text-xs mt-2 text-slate-400">${waktuLog}</p>
                               </div>`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('ERROR', `Siswa dengan kode ${cleanKode} tidak ditemukan di database.`, 'error');
                }
            } catch (e) {
                document.getElementById('result-label').innerText = "KONEKSI BERMASALAH";
            } finally {
                setTimeout(() => {
                    isProcessing = false;
                    html5QrCode.resume();
                    document.getElementById('result-label').innerText = "AI READY: POSISIKAN BARCODE";
                }, 3000);
            }
        }
    </script>
</body>
</html>
