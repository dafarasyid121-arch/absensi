<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi ULTRA CEPAT v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: #000;
        }
        .box {
            width: 100%; 
            max-width: 350px; 
            aspect-ratio: 1/1;
            margin: auto; 
            border-radius: 20px;
            overflow: hidden; 
            border: 4px solid #3b82f6;
            position: relative;
            box-shadow: 0 10px 30px rgba(59,130,246,0.3);
        }
        .scan-line {
            position: absolute; 
            width: 100%; 
            height: 3px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            top: 0; 
            animation: scan 1.5s linear infinite;
            box-shadow: 0 0 10px #ef4444;
        }
        @keyframes scan { 
            0%, 100% { top: 0%; } 
            50% { top: 100%; } 
        }
        .retry-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            opacity: 0;
            transition: all 0.3s;
        }
        .box.error .retry-btn { opacity: 1; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900/20 to-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div id="loading" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="text-center animate-pulse">
            <div class="w-16 h-16 border-4 border-blue-500/30 border-t-blue-500 rounded-full mx-auto mb-4 animate-spin"></div>
            <p class="text-xl font-bold">Memuat Kamera Ultra Cepat...</p>
            <p class="text-sm text-gray-400 mt-2">Pastikan pencahayaan cukup</p>
        </div>
    </div>

    <h1 class="text-2xl font-black mb-6 tracking-tight bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
        SCANNER ABSENSI v3.0
    </h1>

    <div id="cameraBox" class="box relative">
        <div class="scan-line"></div>
        <video id="video" playsinline muted autoplay></video>
        <button id="retryBtn" class="retry-btn">🔄 Ganti Kamera</button>
    </div>

    <div class="mt-6 text-center space-y-2">
        <p id="status" class="text-lg font-mono text-green-400 tracking-wide">🚀 Siap Scan Super Cepat!</p>
        <p id="fps" class="text-xs text-gray-400 font-mono">FPS: --</p>
    </div>

    <script>
        class UltraFastScanner {
            constructor() {
                this.video = document.getElementById('video');
                this.status = document.getElementById('status');
                this.cameraBox = document.getElementById('cameraBox');
                this.retryBtn = document.getElementById('retryBtn');
                this.loading = document.getElementById('loading');
                this.API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr"; // Ganti dengan proxy nanti
                
                this.isScanning = false;
                this.currentStream = null;
                this.lastScanTime = 0;
                this.scanInterval = 100; // 10 FPS max (super ringan)
                this.deviceId = null;
                
                // Beep sound (embedded - no network)
                this.beep = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo');
                
                this.init();
            }

            async init() {
                try {
                    this.showStatus("🔍 Mendeteksi kamera terbaik...");
                    this.loading.classList.remove('hidden');
                    
                    // List semua kamera
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    
                    if (videoDevices.length === 0) {
                        throw new Error("Tidak ada kamera ditemukan");
                    }

                    // Prioritas: Back > Front > Default
                    this.deviceId = this.getBestCamera(videoDevices);
                    this.status.textContent = `📷 Kamera ${videoDevices.find(d => d.deviceId === this.deviceId)?.label || 'Default'} siap!`;
                    
                    await this.startCamera();
                    this.startScanLoop();
                    
                } catch (err) {
                    console.error('Init error:', err);
                    this.handleCameraError(err);
                } finally {
                    this.loading.classList.add('hidden');
                }
            }

            getBestCamera(devices) {
                // 1. Back camera
                let back = devices.find(d => /back|rear|environment/i.test(d.label));
                if (back) return back.deviceId;
                
                // 2. High quality front
                let front = devices.find(d => /front|selfie|face/i.test(d.label));
                if (front) return front.deviceId;
                
                // 3. Default
                return devices[0].deviceId;
            }

            async startCamera() {
                // Stop stream lama
                if (this.currentStream) {
                    this.currentStream.getTracks().forEach(track => track.stop());
                }

                // Kamera config ULTRA CEPAT
                const constraints = {
                    video: {
                        deviceId: { exact: this.deviceId },
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 15, max: 30 }, // Ringan
                        facingMode: "environment"
                    }
                };

                this.currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                this.video.srcObject = this.currentStream;
                
                // Tunggu video ready
                return new Promise((resolve) => {
                    this.video.onloadedmetadata = () => {
                        this.video.play();
                        resolve();
                    };
                });
            }

            // 🔥 SCAN LOOP MANUAL - 10x LEBIH CEPAT DARI ZXING CALLBACK
            startScanLoop() {
                if (this.isScanning) return;
                this.isScanning = true;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const scanFrame = async () => {
                    if (!this.isScanning || this.video.readyState !== 4) {
                        requestAnimationFrame(scanFrame);
                        return;
                    }

                    const now = Date.now();
                    if (now - this.lastScanTime < this.scanInterval) {
                        requestAnimationFrame(scanFrame);
                        return;
                    }
                    this.lastScanTime = now;

                    // Capture frame
                    canvas.width = this.video.videoWidth;
                    canvas.height = this.video.videoHeight;
                    ctx.drawImage(this.video, 0, 0);
                    
                    try {
                        // Decode ULTRA FAST
                        const result = await ZXing.BrowserMultiFormatReader.decodeFromCanvas(
                            canvas, 
                            this.getFastHints()
                        );
                        
                        if (result) {
                            await this.handleSuccess(result.getText());
                            return; // Pause scan setelah sukses
                        }
                    } catch (e) {
                        // No barcode = continue
                    }
                    
                    requestAnimationFrame(scanFrame);
                };
                
                scanFrame();
            }

            getFastHints() {
                return new Map([
                    [ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]],
                    [ZXing.DecodeHintType.TRY_HARDER, false],
                    [ZXing.DecodeHintType.WIDTH, 640],
                    [ZXing.DecodeHintType.HEIGHT, 480]
                ]);
            }

            async handleSuccess(kode) {
                this.isScanning = false;
                this.beep.play();
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                
                this.status.textContent = `✅ TERDETEKSI: ${kode}`;
                document.querySelector('.scan-line').style.animationPlayState = 'paused';
                
                await this.processAPI(kode);
                
                // Restart scan setelah 2 detik
                setTimeout(() => {
                    this.status.textContent = "🔥 Siap Scan Lagi!";
                    document.querySelector('.scan-line').style.animationPlayState = 'running';
                    this.startScanLoop();
                }, 2000);
            }

            async processAPI(kode) {
                try {
                    const now = new Date();
                    const data = await fetch(`${this.API_URL}/search?sheet=Master&KODE=${kode}`)
                        .then(r => r.json());
                    
                    if (data.length > 0) {
                        const nama = data[0].NAMA;
                        Swal.fire({
                            title: nama,
                            text: `${now.toLocaleString('id-ID')} - Berhasil Absen!`,
                            icon: 'success',
                            toast: true,
                            position: 'top-end',
                            timer: 2500,
                            showConfirmButton: false
                        });

                        // Simpan log
                        await fetch(`${this.API_URL}?sheet=Log`, {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                NO: "INCREMENT",
                                WAKTU: now.toLocaleString('id-ID'),
                                KODE: kode,
                                NAMA: nama
                            })
                        });
                    } else {
                        this.status.textContent = "❌ Kode tidak terdaftar";
                    }
                } catch (e) {
                    console.error(e);
                    this.status.textContent = "❌ Error API";
                }
            }

            showStatus(msg) {
                this.status.textContent = msg;
            }

            handleCameraError(err) {
                this.cameraBox.classList.add('error');
                this.status.textContent = "📷 Kamera Error";
                console.error('Camera error:', err);
            }

            async switchCamera() {
                // Toggle camera
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                const currentIndex = videoDevices.findIndex(d => d.deviceId === this.deviceId);
                this.deviceId = videoDevices[(currentIndex + 1) % videoDevices.length].deviceId;
                
                await this.startCamera();
                this.startScanLoop();
                this.cameraBox.classList.remove('error');
            }
        }

        // START
        const scanner = new UltraFastScanner();

        // Event listeners
        document.getElementById('retryBtn').onclick = () => scanner.switchCamera();
        
        // Handle visibility change (tab switch)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                scanner.startScanLoop();
            }
        });
    </script>
</body>
</html>
