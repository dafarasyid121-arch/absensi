<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Presensi SMAN 2 Pare</title>
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .scanner-wrapper { position: relative; width: 300px; height: 300px; border: 4px solid #10b981; border-radius: 20px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .line { position: absolute; width: 100%; height: 3px; background: #10b981; top: 0; animation: move 2s infinite linear; box-shadow: 0 0 10px #10b981; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
        #status { margin-top: 20px; padding: 10px 20px; background: #1e293b; border-radius: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2 style="color: #10b981; margin-bottom: 5px;">SMAN 2 PARE</h2>
    <p style="margin-bottom: 20px; opacity: 0.8;">Attendance Scanner System</p>

    <div class="scanner-wrapper">
        <div class="line"></div>
        <video id="video"></video>
    </div>

    <div id="status">Menunggu Izin Kamera...</div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        const codeReader = new ZXing.BrowserMultiFormatReader();
        let isScanning = false;

        async function initScanner() {
            try {
                const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
                // Pilih kamera belakang secara otomatis
                const backCamera = devices.find(device => device.label.toLowerCase().includes('back')) || devices[devices.length - 1];
                
                document.getElementById('status').innerText = "🟢 Siap Scan Barcode";

                codeReader.decodeFromVideoDevice(backCamera.deviceId, 'video', (result, err) => {
                    if (result && !isScanning) {
                        isScanning = true;
                        processData(result.text);
                    }
                });
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerHTML = "❌ Akses Kamera Ditolak<br><small>Pastikan menggunakan HTTPS</small>";
            }
        }

        async function processData(kode) {
            // Getar HP (jika didukung)
            if (navigator.vibrate) navigator.vibrate(100);
            
            document.getElementById('status').innerText = "⏳ Mengecek Data...";

            try {
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await res.json();

                if (data.length > 0) {
                    const mhs = data[0];
                    // Kirim ke Log
                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            "WAKTU": new Date().toLocaleString('id-ID'),
                            "KODE": kode,
                            "NAMA": mhs.NAMA || mhs.nama,
                            "STATUS": "HADIR"
                        })
                    });

                    Swal.fire({ icon: 'success', title: 'HADIR!', text: mhs.NAMA || mhs.nama, timer: 2000, showConfirmButton: false });
                } else {
                    Swal.fire({ icon: 'error', title: 'TIDAK DIKENAL', text: 'Kode tidak terdaftar di Master' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'ERROR', text: 'Gagal terhubung ke server' });
            }

            // Delay agar tidak scan berkali-kali dalam sekejap
            setTimeout(() => {
                isScanning = false;
                document.getElementById('status').innerText = "🟢 Siap Scan Barcode";
            }, 3000);
        }

        window.onload = initScanner;
    </script>
</body>
</html>
