<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Smart Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-5 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-black text-center mb-2 tracking-tight">SMART SCANNER</h1>
        <p class="text-slate-400 text-center text-xs mb-6 uppercase tracking-widest">Powered by Browser ML Kit</p>
        
        <!-- Viewport Kamera -->
        <div class="relative rounded-2xl overflow-hidden border-4 border-blue-600 aspect-square bg-black shadow-[0_0_20px_rgba(37,99,235,0.4)]">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <!-- Overlay Pemindai -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-64 h-32 border-2 border-yellow-400 opacity-60 rounded-lg"></div>
                <div class="absolute w-full h-[2px] bg-red-500 shadow-[0_0_10px_red] animate-[bounce_2s_infinite]"></div>
            </div>
        </div>

        <div id="status" class="mt-6 p-4 bg-slate-700 rounded-xl text-center font-bold text-blue-300 border border-slate-600">
            Siap Memindai Barcode...
        </div>

        <button onclick="startApp()" id="btnStart" class="w-full mt-5 bg-blue-600 py-4 rounded-2xl font-black text-lg hover:bg-blue-700 transition-all active:scale-95 shadow-lg">
            AKTIFKAN KAMERA
        </button>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusBox = document.getElementById('status');
        
        // --- GANTI DENGAN API URL SHEETDB ANDA ---
        const API_URL = "https://dafarasyid121-arch.github.io/absensi/";

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" } 
                });
                video.srcObject = stream;
                document.getElementById('btnStart').style.display = 'none';
                initMLScanner();
            } catch (err) {
                Swal.fire('Error', 'Gagal akses kamera. Pastikan menggunakan HTTPS/GitHub Pages.', 'error');
            }
        }

        function initMLScanner() {
            // Mengecek apakah browser mendukung BarcodeDetector (Teknologi ML Kit di Browser)
            if (!('BarcodeDetector' in window)) {
                statusBox.innerText = "Browser tidak mendukung ML Scanner. Gunakan Chrome terbaru.";
                return;
            }

            const barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'qr_code', 'ean_13'] });

            setInterval(async () => {
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        const rawData = barcodes[0].rawValue;
                        console.log("Terdeteksi ML:", rawData);
                        prosesAbsensi(rawData);
                    }
                } catch (e) {
                    // Mendeteksi frame...
                }
            }, 500); // Scan setiap 0.5 detik
        }

        async function prosesAbsensi(kode) {
            // Mencegah scan berulang dalam waktu singkat
            if (statusBox.innerText.includes("Berhasil")) return;

            statusBox.innerText = "Mencocokkan Data...";
            try {
                const resMaster = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await resMaster.json();

                if (data.length > 0) {
                    const nama = data[0].nama;
                    const waktu = new Date().toLocaleString('id-ID');

                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "waktu_scan": waktu, "kode": kode, "nama": nama })
                    });

                    Swal.fire({ icon: 'success', title: 'ABSEN BERHASIL', text: `Halo ${nama}!` });
                    statusBox.innerText = `Terakhir: ${nama}`;
                    
                    // Reset scanner setelah 3 detik agar bisa scan orang lain
                    setTimeout(() => { statusBox.innerText = "Siap Memindai..."; }, 3000);
                } else {
                    statusBox.innerText = "KODE TIDAK TERDAFTAR!";
                }
            } catch (err) {
                statusBox.innerText = "Gagal koneksi database.";
            }
        }
    </script>
</body>
</html>
