<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi SMAN 2 Pare</title>

    <!-- ZXING LIGHTWEIGHT VERSION -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* [SAMA PERSIS seperti sebelumnya - full screen kamera] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            height: 100vh; overflow: hidden; color: #1e293b;
        }
        .header { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 15px 25px; border-radius: 20px; border: 3px solid #d1fae5;
            box-shadow: 0 15px 35px rgba(16,185,129,0.3); text-align: center;
        }
        .header h1 { color: #047857; font-size: 1.4em; font-weight: 800; margin-bottom: 2px; }
        .header p { color: #6b7280; font-size: 0.85em; font-weight: 600; letter-spacing: 1px; }
        .scanner-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000;
        }
        .scanner-box { 
            position: relative; width: 90vw; max-width: 400px; height: 90vw; max-height: 400px;
            border-radius: 24px; overflow: hidden; border: 6px solid #10b981;
            box-shadow: 0 30px 60px -15px rgba(16,185,129,0.5), inset 0 2px 8px rgba(255,255,255,0.2);
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { 
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, #10b981, #059669, #10b981, transparent);
            box-shadow: 0 0 25px #10b981; animation: fastScan 0.4s infinite linear; z-index: 10;
        }
        @keyframes fastScan { 0% { top: 0%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .success-flash { 
            animation: successFlash 0.3s ease-out; 
            border-color: #059669 !important;
            box-shadow: 0 0 80px rgba(16,185,129,1), inset 0 4px 12px rgba(255,255,255,0.3) !important;
        }
        @keyframes successFlash { 
            0% { transform: scale(1); box-shadow: 0 0 80px rgba(16,185,129,1); }
            50% { transform: scale(1.02); box-shadow: 0 0 120px rgba(16,185,129,1); }
            100% { transform: scale(1); } 
        }
        #status { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 18px 30px; border-radius: 20px; border: 3px solid #d1fae5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); font-weight: 700; font-size: 1.1em;
            text-align: center; min-width: 280px; transition: all 0.2s ease;
        }
        .status-ready { color: #047857; }
        .status-scan { color: #92400e; background: rgba(254,243,199,0.95); border-color: #f59e0b; }
        .status-success { color: #059669; background: rgba(209,250,229,0.95); border-color: #10b981; }
    </style>
</head>

<body>
    <div class="header">
        <h1>SMAN 2 PARE</h1>
        <p>Presensi Digital</p>
    </div>

    <div class="scanner-container">
        <div id="scannerBox" class="scanner-box">
            <video id="video" playsinline muted></video>
            <div class="scan-line"></div>
        </div>
    </div>

    <div id="status" class="status-ready">Arahkan barcode ke kamera</div>

    <script>
        // GANTI API URL INI!
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const scannerBox = document.getElementById('scannerBox');
        let stream = null;
        let lastScan = 0;
        let isProcessing = false;

        // ⚡ ULTRA FAST - Custom ZXing
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
            ZXing.BarcodeFormat.QR_CODE,
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.CODE_39
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        const codeReader = new ZXing.BrowserQRCodeReader(50, hints); // ⚡ 50ms scan!

        async function initScanner() {
            status.textContent = '🔄 Kamera siap...';
            status.className = 'status-scan';

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { min: 30, ideal: 60, max: 60 } // ⚡ MAX FPS!
                    }
                });
                
                video.srcObject = stream;
                await video.play();

                // ⚡ START FAST SCANNING
                codeReader.decodeFromVideoDevice(
                    null, 
                    video, 
                    (result, err) => {
                        if (result && !isProcessing && (Date.now() - lastScan > 800)) {
                            processBarcode(result.text);
                        }
                    }
                );

                status.textContent = '✅ SCAN BARCODE';
                status.className = 'status-ready';

            } catch (e) {
                status.textContent = '❌ Kamera error';
                console.error(e);
            }
        }

        // ⚡ PROCESS 0.2s TOTAL!
        async function processBarcode(kode) {
            isProcessing = true;
            lastScan = Date.now();
            scannerBox.classList.add('success-flash');

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            status.textContent = `Cek: ${kode.slice(0, 10)}...`;
            status.className = 'status-scan';

            try {
                // ⚡ PARALLEL API - SUPER FAST
                const [siswaRes] = await Promise.all([
                    fetch(`${API_URL}/search?sheet=Master&kode=${kode}`)
                        .then(r => r.json())
                ]);

                if (siswaRes.length > 0) {
                    const siswa = siswaRes[0];
                    const now = new Date();
                    const timestamp = now.toLocaleString('id-ID');

                    // ⚡ SAVE PRESENSI
                    await fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "WAKTU": timestamp,
                            "KODE": kode,
                            "NAMA": siswa.NAMA,
                            "KELAS": siswa.KELAS,
                            "STATUS": "HADIR"
                        })
                    });

                    // ⚡ INSTANT FEEDBACK
                    Swal.fire({
                        title: '✅ HADIR!',
                        html: `<b style="font-size:1.3em">${siswa.NAMA}</b><br>
                               <small>${siswa.KELAS} | ${kode}</small>`,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false,
                        backdrop: false,
                        width: '90vw',
                        maxWidth: '400px'
                    });

                    status.textContent = '🎉 BERHASIL! Siap scan lagi';
                    status.className = 'status-success';

                } else {
                    throw new Error('Siswa tidak terdaftar');
                }

            } catch (err) {
                Swal.fire({
                    title: '❌ GAGAL',
                    text: err.message,
                    icon: 'error',
                    timer: 1500,
                    showConfirmButton: false,
                    backdrop: false,
                    width: '90vw'
                });
                status.textContent = 'Scan ulang...';
            }

            // ⚡ AUTO RESTART 1s
            setTimeout(() => {
                scannerBox.classList.remove('success-flash');
                isProcessing = false;
                initScanner(); // Restart scanning
            }, 1000);
        }

        // AUTO START
        window.onload = initScanner;

        // CLEANUP
        window.addEventListener('pagehide', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            codeReader.reset();
        });
    </script>
</body>
</html>
