<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa SMAN 2 Pare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-container {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 1/1;
            background: black; border-radius: 3rem; overflow: hidden;
            border: 4px solid #1e293b;
        }
        .overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle, transparent 150px, rgba(0,0,0,0.8) 150px);
            z-index: 10;
        }
        .scan-line {
            position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
            background: #ef4444; box-shadow: 0 0 15px #ef4444; z-index: 20;
            animation: move 2s infinite ease-in-out;
        }
        @keyframes move {
            0%, 100% { transform: translateY(-60px); }
            50% { transform: translateY(60px); }
        }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md text-center">
        <h1 class="text-3xl font-black mb-1">PRESENSI SISWA</h1>
        <p class="text-blue-500 text-xs font-bold tracking-[0.4em] mb-8 uppercase">SMAN 2 PARE • FIX ENGINE</p>

        <div class="scanner-container mx-auto shadow-2xl">
            <video id="video"></video>
            <div class="overlay"></div>
            <div class="scan-line"></div>
        </div>

        <div class="mt-8 p-5 bg-slate-900 rounded-[2rem] border border-slate-800">
            <p id="status" class="text-blue-400 font-bold">MENGHUBUNGKAN KAMERA...</p>
            <button onclick="location.reload()" class="mt-3 text-xs bg-slate-800 px-4 py-2 rounded-full border border-slate-700">Muat Ulang Kamera</button>
        </div>
    </div>

    <script>
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const statusText = document.getElementById('status');
        const API_URL = "https://sheetdb.io/api/v1/ro774kye7q3fr";
        let isLocked = false;

        async function startScanner() {
            try {
                const videoDevices = await ZXing.BrowserCodeReader.listVideoInputDevices();
                
                // FIX: Cari kamera belakang secara spesifik
                const backCamera = videoDevices.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('rear') ||
                    device.label.toLowerCase().includes('environment')
                );

                const deviceId = backCamera ? backCamera.deviceId : videoDevices[0].deviceId;

                statusText.innerText = "AI SCANNER READY";

                // Memulai scanning
                codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
                    if (result && !isLocked) {
                        const kode = result.getText();
                        // Hanya proses jika panjang kode wajar (NIS 5-10 digit)
                        if (kode.length <= 10) {
                            successAction(kode);
                        }
                    }
                });

            } catch (err) {
                console.error(err);
                statusText.innerText = "ERROR: IZINKAN KAMERA!";
                Swal.fire('Kamera Error', 'Pastikan izin kamera sudah diberikan di browser.', 'error');
            }
        }

        function successAction(kode) {
            isLocked = true;
            if (navigator.vibrate) navigator.vibrate(100);
            statusText.innerText = "KODE TERDETEKSI: " + kode;
            prosesAbsensi(kode);
        }

        async function prosesAbsensi(kode) {
            try {
                const res = await fetch(`${API_URL}/search?sheet=Master&kode=${kode}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    const siswa = data[0];
                    const sekarang = new Date();
                    const waktu = `${sekarang.toLocaleTimeString('id-ID').replace(/\./g, ':')}, ${sekarang.toLocaleDateString('id-ID')}`;

                    // Kirim Log
                    fetch(`${API_URL}?sheet=Log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "WAKTU": waktu, "KODE": kode, "NAMA": siswa.nama })
                    });

                    Swal.fire({
                        title: 'BERHASIL',
                        text: `Halo, ${siswa.nama}!`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Tidak Dikenal', `Kode ${kode} tidak ada di Master.`, 'warning');
                }
            } catch (e) {
                statusText.innerText = "KONEKSI ERROR";
            } finally {
                setTimeout(() => {
                    isLocked = false;
                    statusText.innerText = "SIAP MEMINDAI...";
                }, 3000);
            }
        }

        // Jalankan saat halaman siap
        window.addEventListener('load', startScanner);
    </script>
</body>
</html>
