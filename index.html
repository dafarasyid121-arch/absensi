<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Scanner - Sekolah</title>
    <style>
        /* UI Tema Sekolah: Putih + Hijau */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid #10b981;
        }

        .header h1 {
            color: #047857;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(16,185,129,0.3);
        }

        .header p {
            color: #6b7280;
            font-size: 1.2em;
        }

        .camera-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 3px solid #d1fae5;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        #video {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border-radius: 15px;
            border: 4px solid #10b981;
            background: #e5e7eb;
            display: block;
            margin: 0 auto 20px;
            object-fit: cover;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 25px rgba(16,185,129,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(16,185,129,0.6);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 8px 25px rgba(239,68,68,0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(239,68,68,0.6);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #6b7280, #4b5563);
            color: white;
            box-shadow: 0 8px 25px rgba(107,114,128,0.4);
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 600;
            font-size: 1.1em;
        }

        .status.success {
            background: #d1fae5;
            color: #047857;
            border: 2px solid #10b981;
        }

        .status.error {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #ef4444;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
            border: 2px solid #f59e0b;
        }

        .capture-area {
            text-align: center;
            margin: 20px 0;
        }

        canvas {
            border-radius: 15px;
            border: 3px solid #10b981;
            max-width: 100%;
            height: auto;
            display: none;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            background: white;
            border-radius: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            #video {
                height: 300px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        /* Animasi loading */
        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📷 Webcam Scanner</h1>
            <p>Scan dokumen dengan mudah menggunakan kamera smartphone</p>
        </div>

        <div class="camera-container">
            <div id="status" class="status">Klik "Mulai Kamera" untuk memulai</div>
            <div id="spinner" class="spinner" style="display: none;"></div>
            
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
            
            <div class="controls">
                <button id="startBtn" class="btn btn-primary">🚀 Mulai Kamera</button>
                <button id="captureBtn" class="btn btn-secondary" disabled>📸 Ambil Foto</button>
                <button id="stopBtn" class="btn btn-danger" disabled>⏹️ Stop Kamera</button>
            </div>
            
            <div class="capture-area">
                <a id="downloadBtn" class="btn btn-primary" style="display: none;" download="screenshot.png">
                    💾 Download Gambar
                </a>
            </div>
        </div>

        <div class="footer">
            <p>💚 Dibuat untuk kemudahan scanning dokumen sekolah</p>
        </div>
    </div>

    <script>
        class WebcamScanner {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.status = document.getElementById('status');
                this.spinner = document.getElementById('spinner');
                this.startBtn = document.getElementById('startBtn');
                this.captureBtn = document.getElementById('captureBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                
                this.stream = null;
                this.mediaRecorder = null;

                this.initEventListeners();
            }

            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.startCamera());
                this.captureBtn.addEventListener('click', () => this.captureImage());
                this.stopBtn.addEventListener('click', () => this.stopCamera());
                this.downloadBtn.addEventListener('click', () => this.downloadImage());
            }

            async startCamera() {
                try {
                    this.setStatus('loading', 'Memulai kamera...');
                    this.showSpinner(true);

                    // Konfigurasi kamera yang lebih kompatibel untuk mobile
                    const constraints = {
                        video: {
                            facingMode: 'environment', // Kamera belakang
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };

                    // Fallback untuk browser lama
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error('Browser tidak mendukung kamera');
                    }

                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;
                    
                    this.video.onloadedmetadata = () => {
                        this.video.play();
                        this.setStatus('success', 'Kamera siap! Arahkan ke dokumen yang ingin discan.');
                        this.updateButtons(true);
                        this.showSpinner(false);
                    };

                } catch (error) {
                    console.error('Error accessing camera:', error);
                    this.setStatus('error', `Gagal mengakses kamera: ${error.message}`);
                    
                    // Fallback constraints untuk perangkat tertentu
                    this.tryFallbackConstraints();
                    this.showSpinner(false);
                }
            }

            tryFallbackConstraints() {
                const fallbackConstraints = [
                    { video: { facingMode: 'user' } }, // Kamera depan
                    { video: true }, // Default
                    { video: { width: 640, height: 480 } }
                ];

                fallbackConstraints.forEach(async (constraints, index) => {
                    try {
                        this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                        this.video.srcObject = this.stream;
                        this.setStatus('success', `Kamera ${index + 1} siap!`);
                        this.updateButtons(true);
                    } catch (e) {
                        console.warn(`Fallback ${index + 1} gagal:`, e);
                    }
                });
            }

            captureImage() {
                const videoWidth = this.video.videoWidth;
                const videoHeight = this.video.videoHeight;

                this.canvas.width = videoWidth;
                this.canvas.height = videoHeight;
                this.ctx.drawImage(this.video, 0, 0);

                this.canvas.style.display = 'block';
                this.downloadBtn.style.display = 'inline-block';
                this.setStatus('success', 'Foto berhasil diambil! Klik download untuk menyimpan.');
            }

            downloadImage() {
                const link = this.downloadBtn;
                link.href = this.canvas.toDataURL('image/png');
                link.click();
            }

            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.video.srcObject = null;
                }
                
                this.canvas.style.display = 'none';
                this.downloadBtn.style.display = 'none';
                this.updateButtons(false);
                this.setStatus('', 'Kamera telah dihentikan');
            }

            updateButtons(cameraActive) {
                this.startBtn.disabled = cameraActive;
                this.captureBtn.disabled = !cameraActive;
                this.stopBtn.disabled = !cameraActive;
            }

            setStatus(type, message) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
            }

            showSpinner(show) {
                this.spinner.style.display = show ? 'block' : 'none';
            }
        }

        // Inisialisasi saat halaman dimuat
        window.addEventListener('load', () => {
            new WebcamScanner();
            
            // Request permission otomatis di mobile
            if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
                console.log('Webcam Scanner siap!');
            }
        });

        // Handle visibility change (untuk mobile)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Tab tidak aktif');
            }
        });
    </script>
</body>
</html>
